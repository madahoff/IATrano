name: iatrano-dev

# PostgreSQL et SearXNG pour le développement local avec `pnpm dev`.
#   docker compose -f compose.dev.yaml up -d
services:
  # SearXNG utilisé par la recherche Web quand l'application tourne avec `pnpm dev`.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: dev-only-change-me
      SEARXNG_BASE_URL: http://localhost:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iatrano
      POSTGRES_PASSWORD: iatrano
      POSTGRES_DB: iatrano
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5442}:5432"
    volumes:
      - iatrano-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iatrano -d iatrano"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iatrano-dev-db:
