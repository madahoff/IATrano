# IATrano — déploiement Docker Compose (local ou Dokploy).
#   cp .env.example .env   # puis renseigner les variables obligatoires
#   docker compose up --build -d
#
# Le moteur IA (Ollama, LM Studio…) n'est PAS inclus : l'application réutilise celui qui tourne déjà
# sur la machine hôte ou sur une autre machine du réseau (voir AI_BASE_URL et le README).
# Le moteur de recherche SearXNG (recherche Web du chat) est inclus, sans port publié.

name: iatrano

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iatrano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-iatrano}
    volumes:
      - iatrano-db:/var/lib/postgresql/data
    # Aucun port publié : PostgreSQL n'est joignable que par les services de ce fichier.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Moteur de recherche auto-hébergé utilisé par la recherche Web (API JSON, réseau interne uniquement).
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Définissez SEARXNG_SECRET dans .env (openssl rand -hex 32)}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    # Aucun port publié : seul le service app l'interroge (http://searxng:8080).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  migrate:
    build:
      context: .
      target: migrator
      args:
        NODE_VERSION: ${NODE_VERSION:-22-alpine}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iatrano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-iatrano}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NODE_VERSION: ${NODE_VERSION:-22-alpine}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Démarrage seulement : si SearXNG tombe, le chat continue et signale la recherche indisponible.
      searxng:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iatrano}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-iatrano}
      AUTH_SECRET: ${AUTH_SECRET:?Définissez AUTH_SECRET dans .env (openssl rand -base64 48)}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?Définissez SUPERADMIN_EMAIL dans .env}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?Définissez SUPERADMIN_PASSWORD dans .env}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super administrateur}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_URL_ALLOWLIST: ${AI_URL_ALLOWLIST:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_GENERATIONS_PER_MINUTE: ${RATE_LIMIT_GENERATIONS_PER_MINUTE:-20}
      # Recherche Web (modifiable ensuite dans Administration → Recherche Web)
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-searxng}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    # Permet au conteneur de joindre un moteur IA installé sur la machine hôte (Linux compris).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"

volumes:
  iatrano-db:
